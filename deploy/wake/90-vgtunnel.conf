# VisionGuard frontend->backend tunnel. Only user vgtunnel is affected.
# Allows exactly one thing: local TCP forwarding to 127.0.0.1:8080.
Match User vgtunnel
    AuthorizedKeysFile /etc/ssh/vgtunnel_authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8080
    PermitListen none
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    GatewayPorts no
    ForceCommand /usr/sbin/nologin
