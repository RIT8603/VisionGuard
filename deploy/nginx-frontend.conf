# Render with setup-frontend.sh. Never commit the rendered bearer token.
upstream visionguard_backend {
    server __BACKEND_ADDR__:8080; # VG_BACKEND_ADDRESS
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/visionguard;
    index index.html;

    # The proxy token grants camera/registry controls. Protect every route.
    # Use HTTPS or an SSH tunnel before entering evaluator credentials.
    auth_basic "VisionGuard";
    auth_basic_user_file /etc/nginx/visionguard.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Preserve the browser Host/Origin relationship for backend write checks.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer __BACKEND_TOKEN__"; # VG_BACKEND_TOKEN
    proxy_connect_timeout 10s;
    proxy_hide_header WWW-Authenticate;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /api {
        return 308 /api/;
    }
    location /api/ {
        proxy_pass http://visionguard_backend;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location = /stream.mjpg {
        proxy_pass http://visionguard_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        add_header X-Accel-Buffering no;
    }
}
