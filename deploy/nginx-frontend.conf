# Render with setup-frontend.sh. Never commit the rendered bearer token.
# --- Public demo hardening (no login): endpoint allowlist, rate limits, body checks ---
map $request_method $vg_read_key  { GET $binary_remote_addr; HEAD $binary_remote_addr; default ""; }
map $request_method $vg_write_key { GET ""; HEAD ""; default $binary_remote_addr; }
# Writes carry JSON or no body at all; any other Content-Type gets 415.
map "$request_method:$content_type" $vg_bad_body {
    default 0;
    "~^(POST|PUT|PATCH|DELETE):$" 0;
    "~*^(POST|PUT|PATCH|DELETE):application/json(;.*)?$" 0;
    "~^(POST|PUT|PATCH|DELETE):" 1;
}
limit_req_zone  $vg_read_key        zone=vg_read:10m  rate=30r/s;
limit_req_zone  $vg_write_key       zone=vg_write:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=vg_conn:10m;
limit_req_zone  $vg_write_key       zone=vg_wake:10m  rate=4r/m;

# Wake service: real demo activity = requests a browser sends from this site
# (Sec-Fetch-Site: same-origin). Plain scripts and bots do not keep the GPU awake.
map $http_sec_fetch_site $vg_browser { same-origin 1; default 0; }
log_format vg_activity '$msec $status $request_method $uri';

upstream visionguard_backend {
    server __BACKEND_ADDR__:8080; # VG_BACKEND_ADDRESS
    keepalive 16;
    # Short, so an open upstream connection means a live stream or a request in flight.
    keepalive_timeout 5s;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/visionguard;
    index index.html;
    server_tokens off;

    # Login is off for the public demo; the allowlist and rate limits below
    # limit what visitors can do. To require a login, uncomment both lines
    # (and use HTTPS before anyone types a password).
    # auth_basic "VisionGuard";
    # auth_basic_user_file /etc/nginx/visionguard.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Preserve the browser Host/Origin relationship for backend write checks.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer __BACKEND_TOKEN__"; # VG_BACKEND_TOKEN
    proxy_connect_timeout 10s;
    proxy_hide_header WWW-Authenticate;
    # The backend only sets its token cookie for ?token= logins; never pass one on.
    proxy_hide_header Set-Cookie;
    limit_req_status 429;
    limit_conn_status 429;

    # Static pages: the same headers the backend API sends with its responses.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /api {
        return 308 /api/;
    }
    # Read-only API the dashboard polls (GET/HEAD only).
    location ~ "^/api/(status|events|alerts|snapshot\.jpg|face/status|face/users|face/users/[^/]{1,128}|face/accuracy|reports/(live|events|events\.csv|attendance\.csv)|snapshots/[^/]{1,128})$" {
        limit_except GET { deny all; }
        error_page 403 413 = @vg_disabled;
        limit_req zone=vg_read burst=60 nodelay;
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/vg_activity.log vg_activity if=$vg_browser;
        proxy_pass http://visionguard_backend;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    # Demo controls: module toggles, tuning values, view effect, alert acknowledgement.
    location ~ "^/api/(modules|settings|view|cameras|alerts/ack|alerts/[0-9]{1,12}/ack)$" {
        limit_except GET POST { deny all; }
        error_page 403 = @vg_disabled;
        if ($vg_bad_body) { return 415; }
        client_max_body_size 16k;
        limit_req zone=vg_read burst=60 nodelay;
        limit_req zone=vg_write burst=10 nodelay;
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/vg_activity.log vg_activity if=$vg_browser;
        proxy_pass http://visionguard_backend;
        proxy_read_timeout 60s;
    }
    # Video uploads for file cameras (raw body, streamed to the backend unbuffered).
    location = /api/videos {
        limit_except GET POST { deny all; }
        error_page 403 = @vg_disabled;
        client_max_body_size 4g;
        proxy_request_buffering off;
        limit_req zone=vg_read burst=60 nodelay;
        limit_req zone=vg_write burst=10 nodelay;
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/vg_activity.log vg_activity if=$vg_browser;
        proxy_pass http://visionguard_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # Off on the public demo: face registry writes and any path not listed above.
    location /api/ {
        error_page 413 = @vg_disabled;
        limit_req zone=vg_read burst=60 nodelay;
        default_type application/json;
        return 403 '{"error":"Disabled on the public demo"}';
    }
    # Wake service (deploy/wake/vgwake.py): answers while the GPU backend sleeps.
    # Defining proxy_set_header here drops the inherited backend token.
    location = /wake/status {
        limit_except GET { deny all; }
        error_page 403 = @vg_disabled;
        limit_req zone=vg_read burst=20 nodelay;
        access_log off;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:9100;
    }
    location = /wake/start {
        limit_except POST { deny all; }
        error_page 403 = @vg_disabled;
        if ($vg_bad_body) { return 415; }
        client_max_body_size 1k;
        limit_req zone=vg_wake burst=3 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:9100;
    }
    location @vg_disabled {
        default_type application/json;
        return 403 '{"error":"Disabled on the public demo"}';
    }
    location = /stream.mjpg {
        limit_except GET { deny all; }
        limit_req zone=vg_read burst=60 nodelay;
        limit_conn vg_conn 6;
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/vg_activity.log vg_activity if=$vg_browser;
        proxy_pass http://visionguard_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        add_header X-Accel-Buffering no;
    }
}
